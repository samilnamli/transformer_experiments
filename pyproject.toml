[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "huseyin-karaca" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "dagshub>=0.7.0",
    "datasets<4.0.0",
    "dotenv>=0.9.9",
    "duckdb>=1.5.2",
    "evaluate>=0.4.6",
    "gdown>=6.0.0",
    "huggingface_hub>=0.27.0",
    "hydra-core>=1.3.2",
    "ipython",
    "jiwer>=4.0.0",
    "jupyterlab",
    "librosa>=0.11.0",
    "loguru",
    "matplotlib",
    "mkdocs",
    "mlflow>=3.12.0",
    "notebook",
    "numpy",
    "omegaconf>=2.3.0",
    "pandas",
    "pip",
    "pytest>=9.0.3",
    "python-dotenv",
    "pytorch-lightning>=2.6.1",
    "rich>=13.0.0",
    "ruff",
    "scikit-learn",
    "scipy>=1.11.0",
    "soundfile>=0.13.1",
    "tensorboard>=2.20.0",
    "torch==2.8.0; sys_platform == 'linux'",
    "torch>=2.11.0; sys_platform != 'linux'",
    "tqdm",
    "transformers>=5.5.4",
    "typer",
    "wandb>=0.26.1",
]
requires-python = "~=3.10.0"

# Linux (Colab / Blackwell): torch from PyTorch cu128 index. cu124 wheels have
# no kernels for sm_120 (RTX PRO 6000 Blackwell); cu128 + torch 2.8 supports it.
[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
markers = [
    "dagshub: integration tests that hit DagsHub (require DAGSHUB_USER_TOKEN env var)",
]

[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

