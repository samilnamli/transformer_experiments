# VoxPopuli paper-ready main results — tuned for RunPod L40S / 48 GB VRAM.
# Same statistical protocol as main_results_ami (16 seeds + paired tests).
# batch_size 384 uses ~half the headroom of AMI@96GB (256); drop to 256 on OOM.

defaults:
  - /trainer: default
  - /data: voxpopuli
  - _self_

_target_: src.experiments.base.BaseExperiment
parent_run_name: runpod_v1
seed: 42
seeds: [42, 0, 2, 1337, 31415, 11235, 12321, 27182, 1618, 10101, 7777, 86400, 98765, 34567, 42069, 2026]
fixed_data_split: false

float32_matmul_precision: medium

trainer:
  max_epochs: 50
  precision: bf16-mixed

data:
  batch_size: 384
  max_seq_len: 2000
  eager_load: true
  num_workers: 0

stats:
  metric: wer_mean
  tests:
    - _target_: src.stats.paired_t.NadeauBengioCorrectedTTest
      alpha: 0.05

child_runs:
  - _target_: src.models.transformer.ASRModelSelectorLightning
    name: hierarchical_transformer
    primary_weight: 1.0
    aux_ce_weight: 0.3
    soft_ce_weight: 0.5
    soft_ce_temperature: 1.5
    class_balanced_loss: true
    early_stopping_patience: 10
  - _target_: src.models.baselines.SingleModelBaseline
    name: single_hubert
    model_idx: 0
  - _target_: src.models.baselines.SingleModelBaseline
    name: single_whisper
    model_idx: 1
  - _target_: src.models.baselines.SingleModelBaseline
    name: single_wav2vec2
    model_idx: 2
  - _target_: src.models.baselines.RandomBaseline
    name: random
  - _target_: src.models.baselines.WeightedRandomBaseline
    name: weighted_random
  - _target_: src.models.baselines.OracleBaseline
    name: oracle
  - _target_: src.models.baselines.ROVERBaseline
    name: rover
  - _target_: src.models.baselines.WeightedROVERBaseline
    name: weighted_rover
  - _target_: src.models.mlp.MLPPoolSelectorLightning
    name: mlp_pool_hard_ce
    primary_weight: 0.0
    aux_ce_weight: 1.0
    soft_ce_weight: 0.0
    class_balanced_loss: true
    early_stopping_patience: 10
